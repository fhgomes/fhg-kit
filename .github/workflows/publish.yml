name: Publish

# Publishes every module to GitHub Packages when a version tag is pushed.
# Credentials: the workflow's own GITHUB_TOKEN (packages: write). No long-lived secret is stored.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match libVersion
        run: |
          lib=$(grep '^libVersion=' gradle.properties | cut -d= -f2)
          tag="${GITHUB_REF_NAME#v}"
          [ "$lib" = "$tag" ] || { echo "tag v$tag != libVersion $lib"; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew build --no-daemon

      - name: Publish
        run: ./gradlew publish --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
