# fhg-kit — library versions. Single source of truth: bump libVersion, tag v<libVersion>.
libVersion=0.1.0

# Compile-time only. The library core has NO Spring dependency; Spring wiring lives in the *-spring-boot-starter module.
jspecifyVersion=1.0.1
slf4jVersion=2.0.20

# Tests
junitVersion=6.1.3
assertjVersion=3.27.7

# Used only by the optional *-spring-boot-starter module (as a BOM, compileOnly).
springBootVersion=4.1.2

# Gradle
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
